# Depth-favoured ~884M config: emb 1536 x 24 layers (6 cycles), heads and
# MLP scaled with width from kda_hybrid_128k (one 128-dim head per 128 of
# width, GQA 4:1, SwiGLU hidden at the 8/3 rule rounded to 128).
# BlockAttnRes rewards depth, so this spends the budget on 24 layers rather
# than the 16 layers a width-2048 model of similar size would have.
name: kda_hybrid_d1536_l24
vocab_size: 128256
emb_dim: 1536
num_layers: 24
cycle: [kda, kda, kda, gqa]
num_cycles: 6
mlp_dim: 4224
fused_mlp: true
rms_norm_epsilon: 1.0e-5
dtype: bfloat16
weight_dtype: float32
param_scan_axis: 1
remat_policy: minimal_with_context
residual_policy: block_attnres
logits_via_embedding: true
dropout_rate: 0.0
kda:
  chunk_size: 64
  num_heads: 12
  key_head_dim: 128
  value_head_dim: 128
  conv_kernel_size: 4
  gate_rank: 128
  qk_norm: true
  safe_gate: true
  gate_lower_bound: -5.0
  precision: guarded_fp32
attention:
  implementation: tokamax_splash
  num_query_heads: 12
  num_kv_heads: 3
  head_dim: 128
  block_q: 1024
  block_q_dkv: 2048
  fused_qkv: true
  rope: false
# MEASURED 2026-07-29 on v4-64 at this config (884M, PDB 8 x 2048, 32 chips,
# 40-step p10): chunked block 256 1254.2 ms, 512 1250.6, 1024 1249.5, 2048
# 1268.7, standard 1225.0. Enlarging the chunk barely moves it (+0.4% at
# best, and 2048 regresses), so the vocab head's ~20% of the step is the
# 128k tied head itself, not chunk-size MXU starvation. Standard wins by
# 2.3% and its logits fit here; revisit if per-device batch grows.
loss:
  implementation: standard
