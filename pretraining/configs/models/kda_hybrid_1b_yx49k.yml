# ~0.98B depth-first hybrid on the yx49k vocabulary: kda_hybrid_1b_deep
# with the 128k table swapped for the 49,152-token exact-teacher-subset
# tokenizer. Tied embeddings put ~92% of parameters in the transformer
# body (75.5M embedding, ~900M compute-bearing), and the small head keeps
# the chunked loss light. KDA heads scale with width (H = d/128 = 12).
# remat_save_kda_residuals is off (at seq 4096 the saved state history
# is ~0.8 GB per KDA layer per microbatch-4), and remat is
# save_dot_except_mlp: MEASURED at 884M on v4-64, minimal_with_context
# already exceeds HBM at PDB 8/2048, and the 1B at PDB 4/4096 with
# minimal_with_context asks 35.89G of HLO temporaries against 30.75G.
# Chunked block 256 keeps the loss temporaries at ~200 MB.
# MEASURED 2026-08-10 on v4-64, 14-step medians at PDB4/4096 vision+text:
# block_attnres: re-measured 2026-08-18 on the current loop (same code,
# same stream, from-scratch init): +264 ms at 4k/PDB4 (1,757 vs 1,493
# ms, +17.7%) and +245 ms at 8k/PDB2 (1,865 vs 1,620, +15%) - and it
# FITS at 8k/PDB2 (XLA's 39.9 G "estimated peak" exceeds the 34.4 G HBM
# at both shapes and is not what gets allocated). The 736 ms recorded
# earlier (2,309 -> 1,573 ms) was measured before the data-path/GC
# fixes. Profile (results/v4-64-datapath-smoke-20260817/SUMMARY.md, "AttnRes
# re-investigation"): the cost is the depth READS (per-site combine
# einsums 114 ms + their bf16 cotangent accumulation ~100 ms + hoisted
# scores 38 ms); the buffer copies are ~9 ms. Hoisting the numerators
# in XLA (commit 6d0bc46, exact to rounding) cut the read einsums 152 ->
# 93 ms but XLA gave it back in fp32 buffer-sized intermediates, casts
# and a no-longer-in-place DUS (net -0.4%): the remaining lever is a
# fused Pallas read (see the SUMMARY section). Earlier notes: save_dot_context
# neutral, scan_unroll 4/8 OOM (37.2/50.9 G temporaries).
# Operating point: 1,533 ms -> 342k tok/s, 23.9% parameter-FLOP MFU.
name: kda_hybrid_1b_yx49k
vocab_size: 49152
emb_dim: 1536
num_layers: 32
cycle: [kda, kda, kda, gqa]
num_cycles: 8
mlp_dim: 4096
fused_mlp: false
rms_norm_epsilon: 1.0e-5
dtype: bfloat16
weight_dtype: float32
param_scan_axis: 0
remat_policy: save_dot_except_mlp
remat_save_kda_residuals: false
residual_policy: standard
logits_via_embedding: true
dropout_rate: 0.0
kda:
  chunk_size: 64
  num_heads: 12
  key_head_dim: 128
  value_head_dim: 128
  conv_kernel_size: 4
  gate_rank: 128
  qk_norm: true
  safe_gate: true
  gate_lower_bound: -5.0
  precision: guarded_fp32
  # v4 XLA-path causal depthwise conv as shifted multiply-adds (2026-08-18):
  # p10 step 1,666.0 -> 1,619.6 ms at 8k/PDB2 (-2.8%); 200-step deterministic
  # loss overlay vs "xla" within +-2.6e-3 (mean -2.4e-4). The lax conv's
  # weight-gradient lowering ran at 66 GB/s (52 ms/step). "fused" (conv +
  # SiLU inside the kernel) is correct but perf-neutral on v4 - see
  # results/v4-64-datapath-smoke-20260817/SUMMARY.md.
  conv_impl: shifted
attention:
  implementation: tokamax_splash
  num_query_heads: 12
  num_kv_heads: 3
  head_dim: 128
  block_q: 1024
  block_q_dkv: 2048
  fused_qkv: true
  rope: false
loss:
  implementation: chunked
  block_tokens: 256
