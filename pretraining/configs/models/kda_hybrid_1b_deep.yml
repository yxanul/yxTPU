# Depth-first ~1.09B hybrid for the BlockAttnRes scale-up: Block AttnRes
# rewards layers over width (its depth attention gets more sources per
# read), so this shape spends the parameter budget on 32 layers = 8 cycles —
# eight AttnRes blocks, the count K3 (§2.2) reports recovers most of the
# full-AttnRes benefit — at d=1536 (3x512, inside the v4 GEMM shape rules)
# instead of the width-first d2048/L16 alternative. KDA heads scale with
# width (H = d/128 = 12; the kernel fixes dk=dv=128). Chunked loss is baked
# in: at this scale the standard [B,T,V] logits are what force the
# per-device batch down (see LossConfig).
name: kda_hybrid_1b_deep
vocab_size: 128256
emb_dim: 1536
num_layers: 32
cycle: [kda, kda, kda, gqa]
num_cycles: 8
mlp_dim: 4096
fused_mlp: true
rms_norm_epsilon: 1.0e-5
dtype: bfloat16
weight_dtype: float32
param_scan_axis: 1
remat_policy: minimal_with_context
residual_policy: block_attnres
logits_via_embedding: true
dropout_rate: 0.0
kda:
  chunk_size: 64
  num_heads: 12
  key_head_dim: 128
  value_head_dim: 128
  conv_kernel_size: 4
  gate_rank: 128
  qk_norm: true
  safe_gate: true
  gate_lower_bound: -5.0
  precision: guarded_fp32
attention:
  implementation: tokamax_splash
  num_query_heads: 12
  num_kv_heads: 3
  head_dim: 128
  block_q: 1024
  block_q_dkv: 2048
  fused_qkv: true
  rope: false
loss:
  implementation: chunked
  block_tokens: 256
