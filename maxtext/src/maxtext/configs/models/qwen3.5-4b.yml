# Qwen/Qwen3.5-4B - the text decoder only.
#
# Dense: the released config carries no expert fields at all, so
# num_experts stays 1 and Qwen3_5DecoderLayer selects MlpBlock. The
# published checkpoint is a Qwen3_5ForConditionalGeneration VLM wrapper;
# the vision tower and the single MTP layer are dropped at conversion and
# are deliberately absent here.
#
# use_mrope is false on purpose. The HF text config declares
# mrope_interleaved with sections [11, 11, 10], but for text-only input
# every one of the three position rows carries the same value, so mrope
# degenerates to standard RoPE. Scoring text with plain RoPE is therefore
# exact, not an approximation - and the logit parity check pins it.

# The released weights are bfloat16, so base.yml's float32 default would
# store them at twice the size for no precision gain. It is not free:
# MaxText's layer scan carries the whole parameter set in as an input and
# out as scanned state, so fp32 needs ~32.5G against a v4 chip's 30.75G of
# HBM and the teacher will not load at all. Forward-only use, no optimizer
# state, nothing here wants fp32.
weight_dtype: "bfloat16"

base_emb_dim: 2560
base_num_decoder_layers: 32
base_num_query_heads: 16
base_num_kv_heads: 4
head_dim: 256
base_mlp_dim: 9216
mlp_activations: ["silu", "linear"]
vocab_size: 248320          # padded head; the tokenizer defines 248,077
normalization_layer_epsilon: 1.0e-6
logits_via_embedding: true  # tie_word_embeddings: true

decoder_block: "qwen3_5"
inhomogeneous_layer_cycle_interval: 4   # full_attention_interval
num_experts: 1                          # dense - selects MlpBlock

# GatedDeltaNet mixer (3 of every 4 layers). Note the asymmetry: 16 key
# heads against 32 value heads, unlike the 0.8B's 16/16.
gdn_conv_kernel_dim: 4
gdn_key_head_dim: 128
gdn_value_head_dim: 128
gdn_num_key_heads: 16
gdn_num_value_heads: 32
gdn_chunk_size: 64

# Full attention (every 4th layer), quarter-rotary. The teacher's
# attn_output_gate: true needs no key here - Qwen3NextFullAttention splits
# query and gate from one projection and applies the sigmoid gate
# unconditionally, which is exactly the released behaviour.
partial_rotary_factor: 0.25
rope_max_timescale: 10000000
use_mrope: false

enable_dropout: false
