model:
  name: kda_hybrid_1b_yx49k
  vocab_size: 49152
  emb_dim: 1536
  num_layers: 32
  cycle:
  - kda
  - kda
  - kda
  - gqa
  num_cycles: 8
  mlp_dim: 4096
  fused_mlp: false
  rms_norm_epsilon: 1.0e-05
  dtype: bfloat16
  weight_dtype: float32
  param_scan_axis: 0
  remat_policy: save_dot_except_mlp
  scan_unroll: 1
  remat_save_kda_residuals: false
  residual_policy: standard
  logits_via_embedding: true
  dropout_rate: 0.0
  kda:
    chunk_size: 64
    num_heads: 12
    key_head_dim: 128
    value_head_dim: 128
    conv_kernel_size: 4
    gate_rank: 128
    qk_norm: true
    safe_gate: true
    gate_lower_bound: -5.0
    precision: guarded_fp32
    fused_in_proj: false
  attention:
    implementation: tokamax_splash
    num_query_heads: 12
    num_kv_heads: 3
    head_dim: 128
    block_q: 1024
    block_q_dkv: 2048
    fused_qkv: true
    rope: false
    output_gate: true
  loss:
    implementation: chunked
    block_tokens: 256
  vision:
    enabled: true
    encoder_layers: 12
    encoder_dim: 384
    encoder_heads: 6
    encoder_mlp_dim: 1536
    patch_size: 16
    image_size: 448
    pixel_shuffle: 2
    placeholder_token_id: 49150
    max_images_per_sequence: 4
    dataset_name: HuggingFaceM4/FineVisionMax
    p_text: 0.45
    text_row_tokens: 1024
    min_visual_dependency: 0
    producer_threads: 1
    pad_token_id: 49119
    eos_token_id: 49119
optimizer:
  name: muonclip
  learning_rate: 0.0012
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-08
  weight_decay: 0.1
  gradient_clip_norm: 1.0
  warmup_steps: 2000
  schedule_steps: 48000
  final_learning_rate_fraction: 0.0
  decay_steps: 4800
  muon_beta: 0.95
  muon_epsilon: 1.0e-08
  muon_ns_steps: 5
  muon_consistent_rms: 0.2
  muon_ns_bf16: false
  muon_per_head: false
  muon_kda_out_proj_whole: false
  muon_per_head_scale_compensation: false
  muon_per_head_scale_only: false
  muon_distributed_ns: false
  qk_clip_tau: 100.0
  qk_clip_epsilon: 1.0e-06
data:
  name: climbmix_yx49k
  type: huggingface
  sequence_length: 4096
  per_device_batch_size: 4
  eval_interval: 500
  eval_steps: 8
  eval_fixed_batches: true
  dataset_name: karpathy/climbmix-400b-shuffle
  dataset_path: null
  tokenizer: tokenizers/yx49k-pretrain
  split: train
  eval_split: train
  shuffle_seed: 42
  reuse_example_batch: false
  streaming: true
  validation_fraction: 0.01
  validation_seed: 20260721
  shuffle_buffer_size: 50000
  tokenize_batch_size: 256
  prefetch_batches: 3
  append_eos: true
  text_field: text
hardware:
  name: v4-64
  accelerator: v4-64
  device_count: 32
  chips: 32
  hosts: 8
  mesh:
    data: 32
    fsdp: 1
    tensor: 1
    sequence: 1
  libtpu_init_args:
  - --xla_enable_async_all_gather=true
  multi_host: true
  performance_verified: false
  notes: 'Eight-host data-parallel slice; the TRC grant''s 32-chip on-demand v4 row
    in us-central2-b. On-demand use always requires explicit approval. Flag facts
    measured 2026-07-23: the v5e collective-overlap set compiles here but is performance-neutral
    (step-time floor unchanged on a 200-step A/B), so it is deliberately not adopted;
    the v6e scoped-VMEM flag stays absent; and loss.implementation=tokamax_fused cannot
    be used on v4 at all - tokamax''s mosaic_tpu linear-CE kernel raises "Not supported
    on TPU v4".'
experiment:
  name: vision_1b_trial
  steps: 48000
  gradient_accumulation_steps: 1
  run_dir: runs
  seed: 42
  log_interval: 1
  profile_steps: []
  benchmark: false
  token_budget: null
  acknowledge_no_checkpoint: false
  prefetch_batches: 8
  checkpoint:
    enabled: true
    destination: /home/a1111/yxtpu_ckpts
    save_interval: 4000
    async_save: false
    keep: 3
    resume: true
    allow_weights_only_resume: true
  wandb:
    enabled: true
    project: yxtpu-pretrain
    entity: null
    group: vision-1b-trial
    tags:
    - v4-64
    - vision
    - 1b
    - finevisionmax
    - climbmix
    mode: online
  diagnostics:
    enabled: true
    interval: 500
  harness_eval:
    enabled: true
    interval: 4800
    tasks:
    - hellaswag
    - piqa
    - arc_easy
    - arc_challenge
    - sciq
    - boolq
    - openbookqa
    - copa
    - commonsense_qa
    - lambada_openai
    batch_size_per_device: 1
    num_fewshot: 0
    limit: null
    use_cache: true
  model_overrides:
    vision:
      enabled: true
      dataset_name: HuggingFaceM4/FineVisionMax
      max_images_per_sequence: 4
      p_text: 0.45
    attention:
      output_gate: true
  data_overrides:
    sequence_length: 4096
    per_device_batch_size: 4
    eval_interval: 500
